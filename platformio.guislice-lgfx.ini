; Isolated GUIslice 0.17.2 + LovyanGFX 1.2.32 experiment.
; Run from the repository root: pio run -c platformio.guislice-lgfx.ini -e fnk0086_lgfx
; This NEVER builds or replaces the validated LVGL firmware.
[platformio]
src_dir = prototypes/guislice-lovyangfx/src
include_dir = prototypes/guislice-lovyangfx/include

[env:fnk0086_lgfx]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DUSER_CONFIG_LOADED=1
    -Iinclude
    -Iprototypes/guislice-lovyangfx/include
    ; GUIslice's separate TFT compatibility .cpp is not an LDF dependency of LovyanGFX.
    ; Expose the exact pinned LovyanGFX headers to all translation units.
    -I.pio/libdeps/fnk0086_lgfx/LovyanGFX/src
    -include include/VerifiedDisplaySetup.h
    -include prototypes/guislice-lovyangfx/include/GUIslice_FNK0086.h
lib_deps =
    impulseadventure/GUIslice@0.17.2
    lovyan03/LovyanGFX@1.2.32
extra_scripts = pre:prototypes/guislice-lovyangfx/scripts/add_spi_cpppath.py
lib_ldf_mode = deep+
