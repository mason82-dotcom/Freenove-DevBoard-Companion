; Freenove-DevBoard-Companion LVGL 8.3.11 migration: fixed FNK0086 CFG1
[env:fnk0086]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_HAS_PSRAM
    ; ESP32-audioI2S 3.x expects CORE_DEBUG_LEVEL to be defined (1 = errors).
    -DCORE_DEBUG_LEVEL=1
    -DUSER_SETUP_LOADED=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -Iinclude
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/NetworkClientSecure/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src
    -include include/VerifiedDisplaySetup.h
lib_ldf_mode = chain+
lib_compat_mode = off
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@7.4.2
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2
    ; Webradio decoder, pinned to the release used by the standalone
    ; ESP32-S3-Webradio project (esp-dsp comes with the Arduino 3.3 framework).
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7
    WiFi
    Network
    HTTPClient
    ; File-system headers included by ESP32-audioI2S (no SD/FFat use here).
    FS
    SD
    SD_MMC
    FFat
    SPI

